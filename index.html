// Analyse einer einzelnen Runde: Gewinner-/Verliererzahl, Solo?, Solist.
// winners = Array von playerIds, die als Sieger markiert sind.
function analyzeRound(round, playerIds) {
  const winners = round.winners || [];
  const winnerSet = new Set(winners);
  const losers = playerIds.filter(id => !winnerSet.has(id));
  const wCount = winners.length;
  const lCount = losers.length;

  // Solo: genau 1 Gewinner (Solist gewinnt) oder genau 1 Verlierer (Solist verliert)
  let isSolo = false;
  let soloPlayerId = null;
  let soloWon = null;
  if (wCount === 1 && lCount === 3) {
    isSolo = true;
    soloPlayerId = winners[0];
    soloWon = true;
  } else if (lCount === 1 && wCount === 3) {
    isSolo = true;
    soloPlayerId = losers[0];
    soloWon = false;
  }
  return {
    winners,
    losers,
    wCount,
    lCount,
    isSolo,
    soloPlayerId,
    soloWon
  };
}

// Gesamtpunkte je Spieler über alle (gültigen) Runden eines Spiels.
function gameTotals(game) {
  const totals = {};
  game.playerIds.forEach(id => totals[id] = 0);
  game.rounds.forEach(r => {
    game.playerIds.forEach(id => {
      totals[id] += Number(r.scores?.[id]) || 0;
    });
  });
  return totals;
}

// Platzierungen aus Gesamtpunkten: höchste Punkte = Platz 1.
// Punktgleichheit => gleicher Platz (Standard-Competition-Ranking: 1,1,3,4).
// Rückgabe: { playerId: platz }
function gamePlacements(game) {
  const totals = gameTotals(game);
  const sorted = [...game.playerIds].sort((a, b) => totals[b] - totals[a]);
  const places = {};
  let lastPoints = null;
  let lastPlace = 0;
  sorted.forEach((id, idx) => {
    const pts = totals[id];
    if (pts === lastPoints) {
      places[id] = lastPlace; // gleiche Punkte -> gleicher Platz
    } else {
      places[id] = idx + 1;
      lastPlace = idx + 1;
      lastPoints = pts;
    }
  });
  return places;
}

// ============================================================
// Spieler-Statistik (Phase 3) — abgeleitet aus abgeschlossenen Spielen
// ------------------------------------------------------------
// Zwei Sieg-Ebenen (bewusst getrennt):
//   Runden-Ebene: gewonnene Runden / gespielte Runden
//   Spiel-Ebene:  Platz 1 am Spielende (geteilter Platz 1 zählt) / Spiele
// ============================================================
function computePlayerStats(playerId, games) {
  const finished = games.filter(g => g.status === "finished" && g.playerIds.includes(playerId));
  const stats = {
    gamesPlayed: finished.length,
    // Runden-Ebene
    roundsPlayed: 0,
    roundWins: 0,
    roundLosses: 0,
    // Spiel-Ebene
    gameWins: 0,
    gameLosses: 0,
    placementSum: 0,
    placements: [],
    // Liste aller Platzierungen
    // Punkte
    totalPoints: 0,
    bestRound: null,
    // höchste Punktzahl in einer einzelnen Runde
    worstRound: null,
    // niedrigste Punktzahl in einer einzelnen Runde
    // Solo
    soloPlayed: 0,
    soloWon: 0,
    // Streak (über abgeschlossene Spiele, chronologisch)
    currentStreak: 0 // >0 = Siegesserie, <0 = Niederlagenserie (Spiel-Ebene)
  };

  // Chronologisch für Streak
  const chrono = [...finished].sort((a, b) => (a.finishedAt || 0) - (b.finishedAt || 0));
  chrono.forEach(game => {
    const placements = gamePlacements(game);
    const place = placements[playerId];
    stats.placementSum += place;
    stats.placements.push(place);
    if (place === 1) stats.gameWins += 1;else stats.gameLosses += 1;
    game.rounds.forEach(r => {
      const info = analyzeRound(r, game.playerIds);
      const isWinner = info.winners.includes(playerId);
      stats.roundsPlayed += 1;
      if (isWinner) stats.roundWins += 1;else stats.roundLosses += 1;
      const pts = Number(r.scores?.[playerId]) || 0;
      stats.totalPoints += pts;
      if (stats.bestRound === null || pts > stats.bestRound) stats.bestRound = pts;
      if (stats.worstRound === null || pts < stats.worstRound) stats.worstRound = pts;

      // Solo: nur zählen, wenn dieser Spieler der Solist war
      if (info.isSolo && info.soloPlayerId === playerId) {
        stats.soloPlayed += 1;
        if (info.soloWon) stats.soloWon += 1;
      }
    });
  });

  // Aktuelle Streak auf Spiel-Ebene (vom letzten Spiel rückwärts)
  let streak = 0;
  for (let i = chrono.length - 1; i >= 0; i--) {
    const place = gamePlacements(chrono[i])[playerId];
    const won = place === 1;
    if (i === chrono.length - 1) {
      streak = won ? 1 : -1;
    } else {
      const prevWon = streak > 0;
      if (won === prevWon) {
        streak += won ? 1 : -1;
      } else {
        break;
      }
    }
  }
  stats.currentStreak = streak;

  // Abgeleitete Quoten
  stats.roundWinRate = stats.roundsPlayed > 0 ? stats.roundWins / stats.roundsPlayed : 0;
  stats.gameWinRate = stats.gamesPlayed > 0 ? stats.gameWins / stats.gamesPlayed : 0;
  stats.avgPlacement = stats.gamesPlayed > 0 ? stats.placementSum / stats.gamesPlayed : 0;
  stats.avgPointsPerGame = stats.gamesPlayed > 0 ? stats.totalPoints / stats.gamesPlayed : 0;
  // Spiellängen-unabhängig: Punkte pro Runde, und daraus hochgerechnet auf
  // 100 Runden (griffige Zahl, fairer Vergleich unabhängig von Spiellänge).
  stats.avgPointsPerRound = stats.roundsPlayed > 0 ? stats.totalPoints / stats.roundsPlayed : 0;
  stats.pointsPer100Rounds = stats.avgPointsPerRound * 100;
  stats.soloWinRate = stats.soloPlayed > 0 ? stats.soloWon / stats.soloPlayed : 0;
  return stats;
}

// ============================================================
// Head-to-Head (Phase 5) — pro Runde, aus abgeschlossenen Spielen
// ------------------------------------------------------------
// "gegen X" (Duell): nur Runden, in denen die beiden auf GEGNERseiten
//   standen (einer Gewinner, der andere Verlierer). Sieg = ich habe
//   gewonnen, X verloren.
// "mit X" (Team): nur Runden, in denen beide auf DERSELBEN Seite standen
//   (beide Gewinner oder beide Verlierer). Sieg = beide Gewinner.
// ============================================================
// Rechnet die Runden EINES Spiels in ein bestehendes byOther-Akkumulatorobjekt
// ein. Wird sowohl für die Gesamt-Bilanz (über alle Spiele) als auch für die
// Bilanz eines einzelnen Spiels verwendet.
function accumulateGameH2H(byOther, playerId, game) {
  const ensure = id => {
    if (!byOther[id]) byOther[id] = {
      vsWins: 0,
      vsLosses: 0,
      withWins: 0,
      withLosses: 0
    };
    return byOther[id];
  };
  game.rounds.forEach(r => {
    const info = analyzeRound(r, game.playerIds);
    const meWinner = info.winners.includes(playerId);
    // andere Spieler dieser Runde
    game.playerIds.forEach(otherId => {
      if (otherId === playerId) return;
      const otherWinner = info.winners.includes(otherId);
      const rec = ensure(otherId);
      if (meWinner === otherWinner) {
        // gleiche Seite -> Team-Runde
        if (meWinner) rec.withWins += 1;else rec.withLosses += 1;
      } else {
        // gegnerische Seiten -> Duell-Runde
        if (meWinner) rec.vsWins += 1;else rec.vsLosses += 1;
      }
    });
  });
}

// Gesamt-Bilanz über alle abgeschlossenen Spiele eines Spielers.
function computeHeadToHead(playerId, data) {
  const finished = data.games.filter(g => g.status === "finished" && g.playerIds.includes(playerId));

  // Ergebnis je Gegenspieler-ID: { vsWins, vsLosses, withWins, withLosses }
  const byOther = {};
  finished.forEach(game => accumulateGameH2H(byOther, playerId, game));
  return byOther;
}

// Bilanz nur innerhalb EINES bestimmten Spiels.
function computeHeadToHeadForGame(playerId, game) {
  const byOther = {};
  accumulateGameH2H(byOther, playerId, game);
  return byOther;
}

// Testdaten-Generator — simuliert einen realistischen Datensatz
// mit vielen Spielen, wechselnden 4er-Besetzungen und Solos.
// ============================================================
function generateSimulatedData(numGames = 40) {
  const NAMES = ["Anna", "Ben", "Clara", "David", "Emil", "Frida", "Georg", "Hanna", "Ivo", "Jana"];
  const base = Date.now() - 1000 * 60 * 60 * 24 * 90;
  const players = NAMES.map((name, i) => ({
    id: uid(),
    name,
    createdAt: base + i * 1000
  }));
  const pick = (arr, k) => {
    const c = [...arr];
    const out = [];
    for (let i = 0; i < k; i++) {
      out.push(c.splice(Math.floor(Math.random() * c.length), 1)[0]);
    }
    return out;
  };
  const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const games = [];
  let t = Date.now() - 1000 * 60 * 60 * 24 * 80;
  for (let gi = 0; gi < numGames; gi++) {
    const four = pick(players, 4).map(p => p.id);
    const numRounds = ri(4, 10);
    const rounds = [];
    for (let r = 0; r < numRounds; r++) {
      const roll = Math.random();
      let winners;
      if (roll < 0.12) {
        // Solo-Sieg: 1 Gewinner
        winners = [four[ri(0, 3)]];
      } else if (roll < 0.22) {
        // Solo-Niederlage: 3 Gewinner (1 Verlierer)
        const loser = four[ri(0, 3)];
        winners = four.filter(x => x !== loser);
      } else {
        // Normalspiel 2v2
        winners = pick(four, 2);
      }
      const isSolo = winners.length === 1 || winners.length === 3;
      const pts = isSolo ? ri(3, 9) : ri(1, 5);
      const scores = {};
      four.forEach(id => scores[id] = winners.includes(id) ? pts : 0);
      rounds.push({
        winners,
        scores
      });
    }
    t += 1000 * 60 * 60 * ri(20, 72);
    games.push({
      id: uid(),
      playerIds: four,
      rounds,
      status: "finished",
      startedAt: t - 1000 * 60 * 90,
      finishedAt: t
    });
  }
  return {
    players,
    games
  };
}
