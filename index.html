// Hooks aus dem globalen React verfügbar machen
const { useState, useEffect, useCallback, useRef, useLayoutEffect, useMemo } = React;


// ============================================================
// Doppelkopf-Statistik-App
// Phase 1: Grundgerüst + Spielerverwaltung + Persistenz
// Phase 2: Spiel-Management (Runden, Solo-Erkennung, Abschluss)
// ------------------------------------------------------------
// Datenmodell (bewusst schlank, auf spätere Phasen ausgelegt):
//   players: [{ id, name, createdAt }]
//   games:   [{ id, playerIds:[4],
//              rounds:[{ scores:{playerId:punkte}, winners:[playerId,...] }],
//              status:'active'|'finished', startedAt, finishedAt }]
//
// Regeln der Gruppe:
//   - Sieg/Niederlage pro Runde wird MANUELL markiert (winners-Array),
//     nicht aus dem Vorzeichen abgeleitet.
//   - Nur Gewinner bekommen Punkte, Verlierer bekommen 0.
//   - Solo = genau 1 Gewinner ODER genau 1 Verlierer. Der allein
//     Stehende ist der Solist.
// Punkte + winners sind die einzige Quelle der Wahrheit. Solo &
// Platzierung werden daraus berechnet, nie gespeichert.
// ============================================================

const STORAGE_KEY = "doko:data:v1";

// ---------- Cloud-Speicher (Cloudflare Worker) ----------
// Alle Geräte teilen denselben Speicher über diesen Worker.
// Als Sicherheitsnetz wird zusätzlich immer eine lokale Kopie gehalten,
// damit die App auch offline startet und nichts verloren geht.
const CLOUD_URL = "https://doko-speicher.basti9491.workers.dev/";
const CLOUD_SECRET = "Doppelkopf";

const emptyData = { players: [], games: [] };

// Lokale Kopie lesen (Fallback / Offline-Start)
function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return emptyData;
}

// Lokale Kopie schreiben
function saveLocal(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {}
}

// Aus der Cloud laden. Bei Fehler (offline o. Ä.) null zurückgeben,
// damit der Aufrufer auf die lokale Kopie zurückfallen kann.
async function loadCloud() {
  try {
    const res = await fetch(CLOUD_URL, {
      method: "GET",
      headers: { "X-Doko-Secret": CLOUD_SECRET },
    });
    if (!res.ok) return null;
    const d = await res.json();
    return { players: d.players || [], games: d.games || [] };
  } catch (e) {
    return null;
  }
}

// In die Cloud speichern. Gibt true/false zurück (Erfolg).
async function saveCloud(data) {
  try {
    const res = await fetch(CLOUD_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Doko-Secret": CLOUD_SECRET,
      },
      body: JSON.stringify(data),
    });
    return res.ok;
  } catch (e) {
    return false;
  }
}

const uid = () =>
  Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// Kein hartes Limit mehr — die Gruppe ist typischerweise 7–10 groß,
// gelegentlich kommen neue Spieler dazu.

// ============================================================
// Spiel-Logik / Berechnungen (abgeleitet, nie gespeichert)
// ============================================================

// Analyse einer einzelnen Runde: Gewinner-/Verliererzahl, Solo?, Solist.
// winners = Array von playerIds, die als Sieger markiert sind.
function analyzeRound(round, playerIds) {
  const winners = round.winners || [];
  const winnerSet = new Set(winners);
  const losers = playerIds.filter((id) => !winnerSet.has(id));

  const wCount = winners.length;
  const lCount = losers.length;

  // Solo: genau 1 Gewinner (Solist gewinnt) oder genau 1 Verlierer (Solist verliert)
  let isSolo = false;
  let soloPlayerId = null;
  let soloWon = null;
  if (wCount === 1 && lCount === 3) {
    isSolo = true;
    soloPlayerId = winners[0];
    soloWon = true;
  } else if (lCount === 1 && wCount === 3) {
    isSolo = true;
    soloPlayerId = losers[0];
    soloWon = false;
  }

  return { winners, losers, wCount, lCount, isSolo, soloPlayerId, soloWon };
}

// Ist eine Runde vollständig erfassbar/gültig?
// Gültig, sobald mindestens 1 Gewinner UND mindestens 1 Verlierer markiert sind.
function isRoundValid(round, playerIds) {
  const w = (round.winners || []).length;
  return w >= 1 && w <= 3;
}

// Gesamtpunkte je Spieler über alle (gültigen) Runden eines Spiels.
function gameTotals(game) {
  const totals = {};
  game.playerIds.forEach((id) => (totals[id] = 0));
  game.rounds.forEach((r) => {
    game.playerIds.forEach((id) => {
      totals[id] += Number(r.scores?.[id]) || 0;
    });
  });
  return totals;
}

// Platzierungen aus Gesamtpunkten: höchste Punkte = Platz 1.
// Punktgleichheit => gleicher Platz (Standard-Competition-Ranking: 1,1,3,4).
// Rückgabe: { playerId: platz }
function gamePlacements(game) {
  const totals = gameTotals(game);
  const sorted = [...game.playerIds].sort(
    (a, b) => totals[b] - totals[a]
  );
  const places = {};
  let lastPoints = null;
  let lastPlace = 0;
  sorted.forEach((id, idx) => {
    const pts = totals[id];
    if (pts === lastPoints) {
      places[id] = lastPlace; // gleiche Punkte -> gleicher Platz
    } else {
      places[id] = idx + 1;
      lastPlace = idx + 1;
      lastPoints = pts;
    }
  });
  return places;
}

// ============================================================
// Spieler-Statistik (Phase 3) — abgeleitet aus abgeschlossenen Spielen
// ------------------------------------------------------------
// Zwei Sieg-Ebenen (bewusst getrennt):
//   Runden-Ebene: gewonnene Runden / gespielte Runden
//   Spiel-Ebene:  Platz 1 am Spielende (geteilter Platz 1 zählt) / Spiele
// ============================================================
function computePlayerStats(playerId, games) {
  const finished = games.filter(
    (g) => g.status === "finished" && g.playerIds.includes(playerId)
  );

  const stats = {
    gamesPlayed: finished.length,
    // Runden-Ebene
    roundsPlayed: 0,
    roundWins: 0,
    roundLosses: 0,
    // Spiel-Ebene
    gameWins: 0,
    gameLosses: 0,
    placementSum: 0,
    placements: [], // Liste aller Platzierungen
    // Punkte
    totalPoints: 0,
    bestRound: null, // höchste Punktzahl in einer einzelnen Runde
    worstRound: null, // niedrigste Punktzahl in einer einzelnen Runde
    // Solo
    soloPlayed: 0,
    soloWon: 0,
    // Streak (über abgeschlossene Spiele, chronologisch)
    currentStreak: 0, // >0 = Siegesserie, <0 = Niederlagenserie (Spiel-Ebene)
  };

  // Chronologisch für Streak
  const chrono = [...finished].sort(
    (a, b) => (a.finishedAt || 0) - (b.finishedAt || 0)
  );

  chrono.forEach((game) => {
    const placements = gamePlacements(game);
    const place = placements[playerId];
    stats.placementSum += place;
    stats.placements.push(place);
    if (place === 1) stats.gameWins += 1;
    else stats.gameLosses += 1;

    game.rounds.forEach((r) => {
      const info = analyzeRound(r, game.playerIds);
      const isWinner = info.winners.includes(playerId);
      stats.roundsPlayed += 1;
      if (isWinner) stats.roundWins += 1;
      else stats.roundLosses += 1;

      const pts = Number(r.scores?.[playerId]) || 0;
      stats.totalPoints += pts;
      if (stats.bestRound === null || pts > stats.bestRound)
        stats.bestRound = pts;
      if (stats.worstRound === null || pts < stats.worstRound)
        stats.worstRound = pts;

      // Solo: nur zählen, wenn dieser Spieler der Solist war
      if (info.isSolo && info.soloPlayerId === playerId) {
        stats.soloPlayed += 1;
        if (info.soloWon) stats.soloWon += 1;
      }
    });
  });

  // Aktuelle Streak auf Spiel-Ebene (vom letzten Spiel rückwärts)
  let streak = 0;
  for (let i = chrono.length - 1; i >= 0; i--) {
    const place = gamePlacements(chrono[i])[playerId];
    const won = place === 1;
    if (i === chrono.length - 1) {
      streak = won ? 1 : -1;
    } else {
      const prevWon = streak > 0;
      if (won === prevWon) {
        streak += won ? 1 : -1;
      } else {
        break;
      }
    }
  }
  stats.currentStreak = streak;

  // Abgeleitete Quoten
  stats.roundWinRate =
    stats.roundsPlayed > 0 ? stats.roundWins / stats.roundsPlayed : 0;
  stats.gameWinRate =
    stats.gamesPlayed > 0 ? stats.gameWins / stats.gamesPlayed : 0;
  stats.avgPlacement =
    stats.gamesPlayed > 0 ? stats.placementSum / stats.gamesPlayed : 0;
  stats.avgPointsPerGame =
    stats.gamesPlayed > 0 ? stats.totalPoints / stats.gamesPlayed : 0;
  // Spiellängen-unabhängig: Punkte pro Runde, und daraus hochgerechnet auf
  // 100 Runden (griffige Zahl, fairer Vergleich unabhängig von Spiellänge).
  stats.avgPointsPerRound =
    stats.roundsPlayed > 0 ? stats.totalPoints / stats.roundsPlayed : 0;
  stats.pointsPer100Rounds = stats.avgPointsPerRound * 100;
  stats.soloWinRate =
    stats.soloPlayed > 0 ? stats.soloWon / stats.soloPlayed : 0;

  return stats;
}

// ============================================================
// Head-to-Head (Phase 5) — pro Runde, aus abgeschlossenen Spielen
// ------------------------------------------------------------
// "gegen X" (Duell): nur Runden, in denen die beiden auf GEGNERseiten
//   standen (einer Gewinner, der andere Verlierer). Sieg = ich habe
//   gewonnen, X verloren.
// "mit X" (Team): nur Runden, in denen beide auf DERSELBEN Seite standen
//   (beide Gewinner oder beide Verlierer). Sieg = beide Gewinner.
// ============================================================
function computeHeadToHead(playerId, data) {
  const finished = data.games.filter(
    (g) => g.status === "finished" && g.playerIds.includes(playerId)
  );

  // Ergebnis je Gegenspieler-ID: { vsWins, vsLosses, withWins, withLosses }
  const byOther = {};
  const ensure = (id) => {
    if (!byOther[id])
      byOther[id] = { vsWins: 0, vsLosses: 0, withWins: 0, withLosses: 0 };
    return byOther[id];
  };

  finished.forEach((game) => {
    game.rounds.forEach((r) => {
      const info = analyzeRound(r, game.playerIds);
      const meWinner = info.winners.includes(playerId);
      // andere Spieler dieser Runde
      game.playerIds.forEach((otherId) => {
        if (otherId === playerId) return;
        const otherWinner = info.winners.includes(otherId);
        const rec = ensure(otherId);
        if (meWinner === otherWinner) {
          // gleiche Seite -> Team-Runde
          if (meWinner) rec.withWins += 1;
          else rec.withLosses += 1;
        } else {
          // gegnerische Seiten -> Duell-Runde
          if (meWinner) rec.vsWins += 1;
          else rec.vsLosses += 1;
        }
      });
    });
  });

  return byOther;
}

// ============================================================
// Testdaten-Generator — simuliert einen realistischen Datensatz
// mit vielen Spielen, wechselnden 4er-Besetzungen und Solos.
// ============================================================
function generateSimulatedData(numGames = 40) {
  const NAMES = [
    "Anna", "Ben", "Clara", "David", "Emil",
    "Frida", "Georg", "Hanna", "Ivo", "Jana",
  ];
  const base = Date.now() - 1000 * 60 * 60 * 24 * 90;
  const players = NAMES.map((name, i) => ({
    id: uid(),
    name,
    createdAt: base + i * 1000,
  }));

  const pick = (arr, k) => {
    const c = [...arr];
    const out = [];
    for (let i = 0; i < k; i++) {
      out.push(c.splice(Math.floor(Math.random() * c.length), 1)[0]);
    }
    return out;
  };
  const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

  const games = [];
  let t = Date.now() - 1000 * 60 * 60 * 24 * 80;
  for (let gi = 0; gi < numGames; gi++) {
    const four = pick(players, 4).map((p) => p.id);
    const numRounds = ri(4, 10);
    const rounds = [];
    for (let r = 0; r < numRounds; r++) {
      const roll = Math.random();
      let winners;
      if (roll < 0.12) {
        // Solo-Sieg: 1 Gewinner
        winners = [four[ri(0, 3)]];
      } else if (roll < 0.22) {
        // Solo-Niederlage: 3 Gewinner (1 Verlierer)
        const loser = four[ri(0, 3)];
        winners = four.filter((x) => x !== loser);
      } else {
        // Normalspiel 2v2
        winners = pick(four, 2);
      }
      const isSolo = winners.length === 1 || winners.length === 3;
      const pts = isSolo ? ri(3, 9) : ri(1, 5);
      const scores = {};
      four.forEach((id) => (scores[id] = winners.includes(id) ? pts : 0));
      rounds.push({ winners, scores });
    }
    t += 1000 * 60 * 60 * ri(20, 72);
    games.push({
      id: uid(),
      playerIds: four,
      rounds,
      status: "finished",
      startedAt: t - 1000 * 60 * 90,
      finishedAt: t,
    });
  }

  return { players, games };
}

// ============================================================
function App() {
  const [data, setData] = useState(emptyData);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("spieler");
  // In-App-Bestätigung (window.confirm ist in der Sandbox blockiert)
  const [confirmState, setConfirmState] = useState(null);
  // Sync-Status: 'lade' | 'ok' | 'speichert' | 'offline'
  const [syncStatus, setSyncStatus] = useState("lade");

  // Öffnet ein Bestätigungs-Overlay und ruft onConfirm bei Bestätigung.
  const confirm = useCallback((opts) => {
    setConfirmState({
      message: typeof opts === "string" ? opts : opts.message,
      confirmLabel: opts.confirmLabel || "Bestätigen",
      cancelLabel: opts.cancelLabel || "Abbrechen",
      danger: opts.danger || false,
      onConfirm: opts.onConfirm || (() => {}),
    });
  }, []);

  // Initial laden: erst Cloud versuchen, sonst lokale Kopie.
  useEffect(() => {
    let alive = true;
    (async () => {
      const cloud = await loadCloud();
      if (!alive) return;
      if (cloud) {
        setData(cloud);
        saveLocal(cloud); // lokale Kopie aktualisieren
        setSyncStatus("ok");
      } else {
        // Cloud nicht erreichbar -> lokale Kopie, Status offline
        setData(loadLocal());
        setSyncStatus("offline");
      }
      setLoaded(true);
    })();
    return () => {
      alive = false;
    };
  }, []);

  // Bei jeder Änderung speichern: lokal sofort (Sicherheitsnetz),
  // Cloud mit kurzer Verzögerung (Debounce), damit nicht bei jedem
  // Tastendruck ein Netzwerk-Aufruf passiert.
  const saveTimer = useRef(null);
  const firstSave = useRef(true);
  useEffect(() => {
    if (!loaded) return;
    // Direkt nach dem initialen Laden nicht sofort zurückspeichern
    if (firstSave.current) {
      firstSave.current = false;
      return;
    }
    saveLocal(data);
    setSyncStatus("speichert");
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      const ok = await saveCloud(data);
      setSyncStatus(ok ? "ok" : "offline");
    }, 800);
    return () => {
      if (saveTimer.current) clearTimeout(saveTimer.current);
    };
  }, [data, loaded]);

  const update = useCallback((fn) => {
    setData((prev) => fn(prev));
  }, []);

  if (!loaded) {
    return (
      <div style={S.loading}>
        <div style={S.loadingText}>Lade Spielstand…</div>
      </div>
    );
  }

  return (
    <div style={S.app}>
      <style>{`
        button, select, input, [role="button"] {
          -webkit-tap-highlight-color: transparent;
        }
        button:focus, button:focus-visible,
        select:focus, [role="button"]:focus, [role="button"]:focus-visible {
          outline: none;
          box-shadow: none;
        }
        button::-moz-focus-inner { border: 0; }
      `}</style>
      <Header />
      <Nav tab={tab} setTab={setTab} />
      <main style={S.main}>
        {tab === "spiel" && (
          <GameManager data={data} update={update} confirm={confirm} />
        )}
        {tab === "statistiken" && <StatsView data={data} />}
        {tab === "ranglisten" && <RankingsView data={data} />}
        {tab === "duelle" && <HeadToHeadView data={data} />}
        {tab === "spieler" && (
          <PlayerManager data={data} update={update} confirm={confirm} />
        )}
      </main>
      <Footer
        count={data.players.length}
        games={data.games.length}
        syncStatus={syncStatus}
      />

      {confirmState && (
        <ConfirmDialog
          {...confirmState}
          onClose={() => setConfirmState(null)}
        />
      )}
    </div>
  );
}

// ============================================================
// Wiederverwendbarer Bestätigungsdialog (ersetzt window.confirm)
// ============================================================
function ConfirmDialog({
  message,
  confirmLabel,
  cancelLabel,
  danger,
  onConfirm,
  onClose,
}) {
  return (
    <div style={S.modalBackdrop} onClick={onClose}>
      <div style={S.confirmCard} onClick={(e) => e.stopPropagation()}>
        <div style={S.confirmMsg}>{message}</div>
        <div style={S.confirmActions}>
          <button style={S.confirmCancel} onClick={onClose}>
            {cancelLabel}
          </button>
          <button
            style={{
              ...S.confirmOk,
              ...(danger ? S.confirmOkDanger : {}),
            }}
            onClick={() => {
              onConfirm();
              onClose();
            }}
          >
            {confirmLabel}
          </button>
        </div>
      </div>
    </div>
  );
}

// ============================================================
function Header() {
  return (
    <header style={S.header}>
      <div style={S.logo}>
        <span style={S.logoMark}>♦</span>
        <div>
          <div style={S.logoTitle}>Doppelkopf</div>
          <div style={S.logoSub}>Statistik &amp; Bilanzen</div>
        </div>
      </div>
    </header>
  );
}

function Nav({ tab, setTab }) {
  const items = [
    { id: "spiel", label: "Spiel" },
    { id: "statistiken", label: "Statistik" },
    { id: "ranglisten", label: "Ranglisten" },
    { id: "duelle", label: "Duelle" },
    { id: "spieler", label: "Spieler" },
  ];
  return (
    <nav style={S.nav}>
      {items.map((it) => {
        const active = tab === it.id;
        return (
          <button
            key={it.id}
            onClick={(e) => {
              setTab(it.id);
              e.currentTarget.blur();
            }}
            style={{ ...S.navBtn, ...(active ? S.navBtnActive : {}) }}
          >
            {it.label}
          </button>
        );
      })}
    </nav>
  );
}

function Footer({ count, games, syncStatus }) {
  const sync = {
    lade: { text: "lädt…", color: C.textDim },
    ok: { text: "synchronisiert", color: C.green },
    speichert: { text: "speichert…", color: C.accent },
    offline: { text: "offline – nur lokal", color: C.red },
  }[syncStatus] || { text: "", color: C.textDim };
  return (
    <footer style={S.footer}>
      {count} Spieler · {games} Spiele ·{" "}
      <span style={{ color: sync.color, fontWeight: 600 }}>{sync.text}</span>
    </footer>
  );
}

// ============================================================
// Spielerverwaltung
// ============================================================
function PlayerManager({ data, update, confirm }) {
  const [name, setName] = useState("");
  const [editId, setEditId] = useState(null);
  const [editName, setEditName] = useState("");
  const [error, setError] = useState("");

  const players = data.players;

  const nameExists = (n, exceptId = null) =>
    players.some(
      (p) => p.id !== exceptId && p.name.toLowerCase() === n.toLowerCase()
    );

  const addPlayer = () => {
    const n = name.trim();
    if (!n) return;
    if (nameExists(n)) {
      setError("Diesen Namen gibt es schon.");
      return;
    }
    update((prev) => ({
      ...prev,
      players: [...prev.players, { id: uid(), name: n, createdAt: Date.now() }],
    }));
    setName("");
    setError("");
  };

  const startEdit = (p) => {
    setEditId(p.id);
    setEditName(p.name);
    setError("");
  };

  const saveEdit = () => {
    const n = editName.trim();
    if (!n) return;
    if (nameExists(n, editId)) {
      setError("Diesen Namen gibt es schon.");
      return;
    }
    update((prev) => ({
      ...prev,
      players: prev.players.map((p) =>
        p.id === editId ? { ...p, name: n } : p
      ),
    }));
    setEditId(null);
    setEditName("");
    setError("");
  };

  const removePlayer = (id) => {
    const p = players.find((x) => x.id === id);
    const inGame = (data.games || []).some((g) => g.playerIds.includes(id));
    const msg = inGame
      ? `${p.name} hat bereits an Spielen teilgenommen. Löschen entfernt den Spieler aus der Verwaltung — die Spielhistorie bleibt erhalten. Fortfahren?`
      : `${p.name} löschen?`;
    confirm({
      message: msg,
      confirmLabel: "Löschen",
      danger: true,
      onConfirm: () =>
        update((prev) => ({
          ...prev,
          players: prev.players.filter((x) => x.id !== id),
        })),
    });
  };

  return (
    <section>
      <div style={S.sectionHead}>
        <h2 style={S.h2}>Spieler</h2>
        <span style={{ ...S.pill, ...S.pillOk }}>
          {players.length}{" "}
          {players.length === 1 ? "Spieler" : "Spieler"}
        </span>
      </div>

      {/* Anlegen */}
      <div style={S.addRow}>
        <input

function GameManager({ data, update, confirm }) {
  const activeGame = data.games.find((g) => g.status === "active");
  if (activeGame) {
    return (
      <ActiveGame
        data={data}
        game={activeGame}
        update={update}
        confirm={confirm}
      />
    );
  }
  return <GameSetup data={data} update={update} />;
}

// ---------- Setup: 4 Spieler auswählen ----------
function GameSetup({ data, update }) {
  const [selected, setSelected] = useState([]);

  const toggle = (id) => {
    setSelected((prev) => {
      if (prev.includes(id)) return prev.filter((x) => x !== id);
      if (prev.length >= 4) return prev; // max 4
      return [...prev, id];
    });
  };

  const startGame = () => {
    if (selected.length !== 4) return;
    update((prev) => ({
      ...prev,
      games: [
        ...prev.games,
        {
          id: uid(),
          playerIds: selected,
          rounds: [],
          status: "active",
          startedAt: Date.now(),
          finishedAt: null,
        },
      ],
    }));
    setSelected([]);
  };

  const finishedCount = data.games.filter(
    (g) => g.status === "finished"
  ).length;

  if (data.players.length < 4) {
    return (
      <section style={S.placeholder}>
        <div style={S.placeholderMark}>♣</div>
        <h2 style={S.h2}>Neues Spiel</h2>
        <p style={S.placeholderText}>
          Ihr braucht mindestens 4 Spieler in der Verwaltung, um ein Spiel
          zu starten. Legt zuerst unter „Spieler" eure Gruppe an.
        </p>
      </section>
    );
  }

  return (
    <section>
      <div style={S.sectionHead}>
        <h2 style={S.h2}>Neues Spiel</h2>
        <span style={{ ...S.pill, ...S.pillOk }}>{selected.length} / 4</span>
      </div>
      <p style={S.hint}>Wählt die 4 Spieler für diesen Abend aus.</p>

      <div style={S.chipGrid}>
        {data.players.map((p) => {
          const active = selected.includes(p.id);
          const order = selected.indexOf(p.id) + 1;
          return (
            <div
              key={p.id}
              role="button"
              tabIndex={-1}
              onClick={() => toggle(p.id)}
              style={{
                ...S.chip,
                ...(active ? S.chipActive : {}),
              }}
            >
              {active && <span style={S.chipOrder}>{order}</span>}
              {p.name}
            </div>
          );
        })}
      </div>

      <button
        style={{
          ...S.btnPrimaryWide,
          ...(selected.length !== 4 ? S.btnDisabled : {}),
        }}
        onClick={startGame}
        disabled={selected.length !== 4}
      >
        Spiel starten
      </button>

      {finishedCount > 0 && (
        <p style={{ ...S.hint, marginTop: 16, textAlign: "center" }}>
          {finishedCount} abgeschlossene{finishedCount === 1 ? "s" : ""} Spiel
          {finishedCount === 1 ? "" : "e"} gespeichert.
        </p>
      )}
    </section>
  );
}

// ---------- Aktives Spiel: Runden erfassen ----------
function ActiveGame({ data, game, update, confirm }) {
  const players = game.playerIds.map((id) =>
    data.players.find((p) => p.id === id)
  );
  const nameOf = (id) =>
    data.players.find((p) => p.id === id)?.name || "—";

  // Entwurf der aktuellen Runde: Gewinner + EINE gemeinsame Punktzahl
  const emptyDraft = () => ({ winners: [], points: "" });
  const [draft, setDraft] = useState(emptyDraft);
  const [error, setError] = useState("");

  const totals = gameTotals(game);
  const draftAnalysis = analyzeRound(draft, game.playerIds);

  const toggleWinner = (id) => {
    setError("");
    setDraft((d) => {
      const has = d.winners.includes(id);
      const winners = has
        ? d.winners.filter((x) => x !== id)
        : [...d.winners, id];
      return { ...d, winners };
    });
  };

  const setPoints = (val) => {
    // nur nicht-negative Ganzzahlen (bzw. leer)
    if (val !== "" && !/^\d+$/.test(val)) return;
    setError("");
    setDraft((d) => ({ ...d, points: val }));
  };

  const addRound = () => {
    const wCount = draft.winners.length;
    if (wCount < 1 || wCount > 3) {
      setError(
        "Markiert 1 bis 3 Gewinner (Solo = 1 Gewinner oder 3 Gewinner)."
      );
      return;
    }
    if (draft.points === "" || draft.points == null) {
      setError("Bitte die Punktzahl für die Runde eintragen.");
      return;
    }
    const pts = Number(draft.points) || 0;
    // Alle Gewinner bekommen dieselbe Punktzahl, Verlierer bekommen 0.
    const scores = {};
    game.playerIds.forEach((id) => {
      scores[id] = draft.winners.includes(id) ? pts : 0;
    });

    const round = { winners: [...draft.winners], scores };
    update((prev) => ({
      ...prev,
      games: prev.games.map((g) =>
        g.id === game.id ? { ...g, rounds: [...g.rounds, round] } : g
      ),
    }));
    setDraft(emptyDraft());
    setError("");
  };

  const undoLastRound = () => {
    if (game.rounds.length === 0) return;
    confirm({
      message: "Letzte Runde löschen?",
      confirmLabel: "Löschen",
      danger: true,
      onConfirm: () =>
        update((prev) => ({
          ...prev,
          games: prev.games.map((g) =>
            g.id === game.id
              ? { ...g, rounds: g.rounds.slice(0, -1) }
              : g
          ),
        })),
    });
  };

  const doFinish = () =>
    update((prev) => ({
      ...prev,
      games: prev.games.map((g) =>
        g.id === game.id
          ? { ...g, status: "finished", finishedAt: Date.now() }
          : g
      ),
    }));

  const finishGame = () => {
    if (game.rounds.length === 0) {
      confirm({
        message:
          "Dieses Spiel hat noch keine Runden. Trotzdem abschließen? Es wird ohne Wertung gespeichert.",
        confirmLabel: "Abschließen",
        onConfirm: doFinish,
      });
    } else {
      confirm({
        message: "Spiel abschließen und Platzierungen berechnen?",
        confirmLabel: "Abschließen",
        onConfirm: doFinish,
      });
    }
  };

  const cancelGame = () => {
    confirm({
      message:
        "Spiel abbrechen? Alle erfassten Runden dieses Spiels gehen verloren.",
      confirmLabel: "Abbrechen",
      cancelLabel: "Zurück",
      danger: true,
      onConfirm: () =>
        update((prev) => ({
          ...prev,
          games: prev.games.filter((g) => g.id !== game.id),
        })),
    });
  };

  // Rangfolge für Zwischenstand
  const ranked = [...game.playerIds].sort((a, b) => totals[b] - totals[a]);

  return (
    <section style={{ position: "relative" }}>
      <div style={S.sectionHead}>
        <h2 style={S.h2}>Laufendes Spiel</h2>
        <span style={{ ...S.pill, ...S.pillOk }}>
          Runde {game.rounds.length + 1}
        </span>
      </div>

      <div style={S.playersBar}>
        {players.map((p) => (
          <span key={p.id} style={S.playerTag}>
            {p.name}
          </span>
        ))}
      </div>

      {/* Zwischenstand */}
      <div style={S.standingCard}>
        <div style={S.standingHead}>Zwischenstand</div>
        {game.rounds.length === 0 ? (
          <div style={S.standingEmpty}>Noch keine Runde gespielt.</div>
        ) : (
          ranked.map((id, i) => (
            <div key={id} style={S.standingRow}>
              <span style={S.standingRank}>{i + 1}.</span>
              <span style={S.standingName}>{nameOf(id)}</span>
              <span style={S.standingPts}>{totals[id]}</span>
            </div>
          ))
        )}
      </div>

      {/* Neue Runde erfassen */}
      <div style={S.roundCard}>
        <div style={S.roundHead}>
          <span>Neue Runde</span>
          {draftAnalysis.isSolo && (
            <span style={S.soloBadge}>
              SOLO ·{" "}
              {draftAnalysis.soloWon
                ? `${nameOf(draftAnalysis.soloPlayerId)} allein`
                : `${nameOf(draftAnalysis.soloPlayerId)} allein`}
            </span>
          )}
        </div>

        <p style={S.roundHint}>
          Tippt die Gewinner an und tragt die Punktzahl der Runde ein. Alle
          Gewinner bekommen diese Punkte, Verlierer bekommen 0.
        </p>

        <div style={S.roundList}>
          {game.playerIds.map((id) => {
            const isWinner = draft.winners.includes(id);
            return (
              <div
                key={id}
                role="button"
                tabIndex={-1}
                onClick={() => toggleWinner(id)}
                style={{
                  ...S.winnerRow,
                  ...(isWinner ? S.winnerRowActive : {}),
                }}
              >
                <span
                  style={{
                    ...S.winnerCheck,
                    ...(isWinner ? S.winnerCheckOn : {}),
                  }}
                >
                  {isWinner ? "✓" : ""}
                </span>
                <span style={S.roundName}>{nameOf(id)}</span>
                <span style={S.winnerState}>
                  {isWinner ? "Sieg" : "Verloren"}
                </span>
              </div>
            );
          })}
        </div>

        <div style={S.pointsRow}>
          <label style={S.pointsLabel}>Punkte für Gewinner</label>
          <input
            style={S.pointsInput}
            inputMode="numeric"
            placeholder="z. B. 3"
            value={draft.points}
            onChange={(e) => setPoints(e.target.value)}
          />
        </div>

        {error && <div style={S.error}>{error}</div>}

        <div style={S.roundActions}>
          <button style={S.btnPrimaryWide} onClick={addRound}>
            Runde eintragen
          </button>
        </div>
        {game.rounds.length > 0 && (
          <button style={S.btnTextGhost} onClick={undoLastRound}>
            Letzte Runde rückgängig
          </button>
        )}
      </div>

      {/* Spiel-Steuerung */}
      <div style={S.gameFooter}>
        <button style={S.btnDanger} onClick={cancelGame}>
          Spiel abbrechen
        </button>
        <button style={S.btnFinish} onClick={finishGame}>
          Spiel abschließen
        </button>
      </div>
    </section>
  );
}

// ---------- Sortierbare Rangliste ----------
function RankingTable({ data }) {
  const metrics = [
    { id: "gameWinRate", label: "Win-Rate (Spiele)", fmt: (s) => `${Math.round(s.gameWinRate * 100)}%` },
    { id: "totalPoints", label: "Gesamtpunkte", fmt: (s) => s.totalPoints },
    { id: "pointsPer100Rounds", label: "Ø / 100 Runden", fmt: (s) => Math.round(s.pointsPer100Rounds) },
    { id: "gameWins", label: "Spiel-Siege", fmt: (s) => s.gameWins },
    { id: "roundWinRate", label: "Win-Rate (Runden)", fmt: (s) => `${Math.round(s.roundWinRate * 100)}%` },
    { id: "avgPlacement", label: "Ø Platzierung", fmt: (s) => (Math.round(s.avgPlacement * 10) / 10).toFixed(1) },
  ];
  const [metricId, setMetricId] = useState("gameWinRate");
  const metric = metrics.find((m) => m.id === metricId);

  // Nur Spieler mit mind. 1 abgeschlossenen Spiel
  const rows = data.players
    .map((p) => ({ player: p, stats: computePlayerStats(p.id, data.games) }))
    .filter((r) => r.stats.gamesPlayed > 0);

  // Sortierung: avgPlacement aufsteigend (1 ist am besten), sonst absteigend
  const ascending = metricId === "avgPlacement";
  const sorted = [...rows].sort((a, b) => {
    const av = a.stats[metricId];
    const bv = b.stats[metricId];
    return ascending ? av - bv : bv - av;
  });

  // Rang (0-basiert) je Spieler-ID aus der sortierten Reihenfolge.
  const rankById = {};
  sorted.forEach((r, i) => {
    rankById[r.player.id] = i;
  });

  // WICHTIG für die Animation: Die DOM-Reihenfolge bleibt STABIL (nach player.id),
  // nur die vertikale Position (top) jeder Zeile ändert sich. Dadurch gleiten die
  // Zeilen an ihren neuen Platz, statt ausgetauscht zu werden.
  const stable = [...rows].sort((a, b) =>
    a.player.id < b.player.id ? -1 : 1
  );

  const ROW_H = 56; // Zeilenhöhe inkl. Abstand (muss zu S.rankRowAnim passen)
  const containerHeight = stable.length * ROW_H;

  return (
    <div>
      <div style={S.metricChips}>
        {metrics.map((m) => (
          <div
            key={m.id}
            role="button"
            tabIndex={-1}
            onClick={() => setMetricId(m.id)}
            style={{
              ...S.metricChip,
              ...(metricId === m.id ? S.metricChipActive : {}),
            }}
          >
            {m.label}
          </div>
        ))}
      </div>

      {stable.length === 0 ? (
        <div style={S.emptyState}>
          Noch keine Spieler mit abgeschlossenen Spielen.
        </div>
      ) : (
        <div style={{ position: "relative", height: containerHeight }}>
          {stable.map((r) => {
            const rank = rankById[r.player.id];
            const isTop = rank === 0;
            return (
              <div
                key={r.player.id}
                style={{
                  ...S.rankRowAnim,
                  transform: `translateY(${rank * ROW_H}px)`,
                  zIndex: stable.length - rank,
                }}
              >
                <span
                  style={{
                    ...S.rankPos,
                    ...(isTop ? S.rankPosTop : {}),
                  }}
                >
                  {rank + 1}
                </span>
                <span style={S.rankName}>{r.player.name}</span>
                <span style={S.rankSub}>{r.stats.gamesPlayed} Sp</span>
                <span style={S.rankValue}>{metric.fmt(r.stats)}</span>
              </div>
            );
          })}
        </div>
      )}
      <p style={S.graphNote}>
        Sortiert nach: {metric.label}
        {ascending ? " (niedriger = besser)" : " (höher = besser)"}
      </p>
    </div>
  );
}

// ---------- Graph pro einzelnem Spiel ----------
function SingleGameGraph({ data }) {
  const finished = data.games
    .filter((g) => g.status === "finished")
    .sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0));

  const [gameId, setGameId] = useState(finished[0]?.id || null);
  const game = finished.find((g) => g.id === gameId) || finished[0];

  const nameOf = (id) =>
    data.players.find((p) => p.id === id)?.name || "—";

  if (!game) return null;

  // Kumulierte Punkte je Spieler über die Runden
  const series = game.playerIds.map((id, idx) => {
    let cum = 0;
    const points = [0]; // Start bei 0 vor Runde 1
    game.rounds.forEach((r) => {
      cum += Number(r.scores?.[id]) || 0;
      points.push(cum);
    });
    return { id, name: nameOf(id), color: LINE_COLORS[idx % LINE_COLORS.length], points };
  });

  const gameLabel = (g) => {
    const names = g.playerIds.map(nameOf).join(", ");
    const d = g.finishedAt ? new Date(g.finishedAt) : null;
    const ds = d
      ? `${d.getDate()}.${d.getMonth() + 1}.`
      : "";
    return `${ds} — ${names}`;
  };

  return (
    <div>
      <label style={S.selectLabel}>Spiel auswählen</label>
      <select
        style={S.select}
        value={game.id}
        onChange={(e) => setGameId(e.target.value)}
      >
        {finished.map((g) => (
          <option key={g.id} value={g.id}>
            {gameLabel(g)}
          </option>
        ))}
      </select>

      <LineChart
        series={series}
        xLabelCount={game.rounds.length}
        xUnit="Runde"
      />

      <Legend series={series} />
    </div>
  );
}

// ---------- All-Time-Graph ----------
function AllTimeGraph({ data }) {
  const finished = data.games
    .filter((g) => g.status === "finished")
    .sort((a, b) => (a.finishedAt || 0) - (b.finishedAt || 0));

  const nameOf = (id) =>
    data.players.find((p) => p.id === id)?.name || "—";

  // Spieler mit mind. 1 abgeschlossenen Spiel
  const eligible = data.players.filter((p) =>
    finished.some((g) => g.playerIds.includes(p.id))
  );

  const [selected, setSelected] = useState(() =>
    eligible.slice(0, 4).map((p) => p.id)
  );

  // Anzeige-Modus des All-Time-Graphen
  const [mode, setMode] = useState("points"); // points | wins | placement
  const modes = [
    { id: "points", label: "Punkte" },
    { id: "wins", label: "Spiel-Siege" },
    { id: "placement", label: "Platz-Punkte" },
  ];

  const toggle = (id) =>
    setSelected((prev) =>
      prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]
    );

  // Wert, den ein Spieler in EINEM Spiel beisteuert — je nach Modus.
  //   points:    Gesamtpunkte des Spielers in diesem Spiel
  //   wins:      1, wenn Platz 1 (auch geteilt), sonst 0
  //   placement: 5 - Platz  (Platz 1 = 4, 2 = 3, 3 = 2, 4 = 1)
  const valueInGame = (id, g) => {
    if (mode === "points") return gameTotals(g)[id] || 0;
    const place = gamePlacements(g)[id];
    if (mode === "wins") return place === 1 ? 1 : 0;
    // placement
    return 5 - place;
  };

  // Für jeden ausgewählten Spieler: kumulierter Wert pro Spiel.
  // X-Achse = Index über ALLE abgeschlossenen Spiele (chronologisch);
  // in Spielen, in denen ein Spieler nicht mitspielte, bleibt die Linie flach.
  const series = selected.map((id) => {
    const colorIdx = eligible.findIndex((p) => p.id === id);
    let cum = 0;
    const points = [0];
    finished.forEach((g) => {
      if (g.playerIds.includes(id)) {
        cum += valueInGame(id, g);
      }
      points.push(cum);
    });
    return {
      id,
      name: nameOf(id),
      color: LINE_COLORS[colorIdx % LINE_COLORS.length],
      points,
    };
  });

  return (
    <div>
      <label style={S.selectLabel}>Ansicht</label>
      <div style={S.subNav}>
        {modes.map((m) => (
          <button
            key={m.id}
            onClick={(e) => {
              setMode(m.id);
              e.currentTarget.blur();
            }}
            style={{
              ...S.subNavBtn,

      <label style={S.selectLabel}>Spieler auswählen</label>
      <div style={S.metricChips}>
        {eligible.map((p) => {
          const active = selected.includes(p.id);
          const colorIdx = eligible.findIndex((x) => x.id === p.id);
          return (
            <div
              key={p.id}
              role="button"
              tabIndex={-1}
              onClick={() => toggle(p.id)}
              style={{
                ...S.metricChip,
                ...(active
                  ? {
                      background: LINE_COLORS[colorIdx % LINE_COLORS.length],
                      color: "#1a1a1a",
                    }
                  : {}),
              }}
            >
              {p.name}
            </div>
          );
        })}
      </div>

      {selected.length === 0 ? (
        <p style={S.hint}>Wählt mindestens einen Spieler aus.</p>
      ) : (
        <>
          <LineChart
            series={series}
            xLabelCount={finished.length}
            xUnit="Spiel"
          />
          <Legend series={series} />
          <p style={S.graphNote}>
            {mode === "points" && "Kumulierte Gesamtpunkte über alle Spiele."}
            {mode === "wins" && "Kumulierte Spiel-Siege (Platz 1, auch geteilt)."}
            {mode === "placement" &&
              "Platz-Punkte je Spiel: 1. = 4, 2. = 3, 3. = 2, 4. = 1 — kumuliert."}
          </p>
        </>
      )}
    </div>
  );
}

// ---------- Wiederverwendbarer SVG-Liniengraph ----------
function LineChart({ series, xLabelCount, xUnit }) {
  const W = 600;
  const H = 320;
  const padL = 44;
  const padR = 16;
  const padT = 16;
  const padB = 34;

  // Max-Wert für Y-Skala
  let maxY = 0;
  let minY = 0;
  series.forEach((s) =>
    s.points.forEach((v) => {
      if (v > maxY) maxY = v;
      if (v < minY) minY = v;
    })
  );
  if (maxY === minY) maxY = minY + 1;
  const stepCount = Math.max(1, (series[0]?.points.length || 1) - 1);

  const xAt = (i) =>
    padL + (i / stepCount) * (W - padL - padR);
  const yAt = (v) =>
    padT + (1 - (v - minY) / (maxY - minY)) * (H - padT - padB);

  // Y-Gitterlinien (4 Abschnitte)
  const yTicks = [];
  for (let t = 0; t <= 4; t++) {
    const val = minY + ((maxY - minY) * t) / 4;
    yTicks.push(val);
  }

  return (
    <div style={S.chartWrap}>
      <svg
        viewBox={`0 0 ${W} ${H}`}
        style={{ width: "100%", height: "auto", display: "block" }}
      >
        {/* Y-Gitter */}
        {yTicks.map((val, i) => {
          const y = yAt(val);
          return (
            <g key={i}>
              <line
                x1={padL}
                y1={y}
                x2={W - padR}
                y2={y}
                stroke="#31404f"
                strokeWidth="1"
              />
              <text
                x={padL - 8}
                y={y + 4}
                textAnchor="end"
                fontSize="11"
                fill="#9fb0c0"
              >
                {Math.round(val)}
              </text>
            </g>
          );
        })}

        {/* X-Achsenbeschriftung (Start + Ende, plus Einheit) */}
        <text
          x={padL}
          y={H - 10}
          textAnchor="start"
          fontSize="11"
          fill="#9fb0c0"
        >
          {xUnit} 0
        </text>
        <text
          x={W - padR}
          y={H - 10}
          textAnchor="end"
          fontSize="11"
          fill="#9fb0c0"
        >
          {xUnit} {xLabelCount}
        </text>

        {/* Linien */}
        {series.map((s) => {
          const d = s.points
            .map((v, i) => `${i === 0 ? "M" : "L"} ${xAt(i)} ${yAt(v)}`)
            .join(" ");
          return (
            <g key={s.id}>
              <path
                d={d}
                fill="none"
                stroke={s.color}
                strokeWidth="2.5"
                strokeLinejoin="round"
                strokeLinecap="round"
              />
              {/* Endpunkt markieren */}
              <circle
                cx={xAt(s.points.length - 1)}
                cy={yAt(s.points[s.points.length - 1])}
                r="3.5"
                fill={s.color}
              />
            </g>
          );
        })}
      </svg>
    </div>
  );
}

function Legend({ series }) {
  return (
    <div style={S.legend}>
      {series.map((s) => (
        <div key={s.id} style={S.legendItem}>
          <span
            style={{ ...S.legendDot, background: s.color }}
          />
          <span style={S.legendName}>{s.name}</span>
          <span style={S.legendVal}>
            {s.points[s.points.length - 1]}
          </span>
        </div>
      ))}
    </div>
  );
}

// ============================================================
// Head-to-Head / Duelle (Phase 5)
// ============================================================
function HeadToHeadView({ data }) {
  const finishedGames = data.games.filter((g) => g.status === "finished");

  // Spieler mit mind. 1 abgeschlossenen Spiel
  const eligible = data.players.filter((p) =>
    finishedGames.some((g) => g.playerIds.includes(p.id))
  );

  const [focusId, setFocusId] = useState(eligible[0]?.id || null);
  const nameOf = (id) => data.players.find((p) => p.id === id)?.name || "—";

  if (finishedGames.length === 0 || eligible.length === 0) {
    return (
      <section style={S.placeholder}>
        <div style={S.placeholderMark}>♠</div>
        <h2 style={S.h2}>Duelle</h2>
        <p style={S.placeholderText}>
          Noch keine abgeschlossenen Spiele. Sobald ihr Spiele beendet,
          erscheinen hier die Bilanzen — gegen jeden und mit jedem.
        </p>
      </section>
    );
  }

  const focus =
    eligible.find((p) => p.id === focusId) || eligible[0];
  const h2h = computeHeadToHead(focus.id, data);

  // Alle anderen Spieler, mit denen es gemeinsame Runden gab
  const others = Object.keys(h2h)
    .map((id) => ({
      id,
      name: nameOf(id),
      ...h2h[id],
    }))
    .filter(
      (o) =>
        o.vsWins + o.vsLosses + o.withWins + o.withLosses > 0
    );

  // Sortierung: nach Anzahl gemeinsamer Runden (meiste zuerst)
  others.sort(
    (a, b) =>
      b.vsWins + b.vsLosses + b.withWins + b.withLosses -
      (a.vsWins + a.vsLosses + a.withWins + a.withLosses)
  );

  return (
    <section>
      <div style={S.sectionHead}>
        <h2 style={S.h2}>Duelle</h2>
      </div>

      <label style={S.selectLabel}>Spieler</label>
      <select
        style={S.select}
        value={focus.id}
        onChange={(e) => setFocusId(e.target.value)}
      >
        {eligible.map((p) => (
          <option key={p.id} value={p.id}>
            {p.name}
          </option>
        ))}
      </select>

      {others.length === 0 ? (
        <p style={S.hint}>
          Für {focus.name} gibt es noch keine gemeinsamen Runden mit anderen
          Spielern.
        </p>
      ) : (
        <div>
          <div style={S.h2hLegendRow}>
            <span style={S.h2hLegendVs}>gegen</span>
            <span style={S.h2hLegendWith}>mit</span>
          </div>
          {others.map((o) => (
            <H2HRow key={o.id} focusName={focus.name} other={o} />
          ))}
          <p style={S.graphNote}>
            „gegen" = Duell-Runden (gegnerische Seiten) · „mit" = Team-Runden
            (gleiche Seite)
          </p>
        </div>
      )}
    </section>
  );
}

function H2HRow({ focusName, other }) {
  const vsTotal = other.vsWins + other.vsLosses;
  const withTotal = other.withWins + other.withLosses;
  const vsRate = vsTotal > 0 ? Math.round((other.vsWins / vsTotal) * 100) : null;

  return (
    <div style={S.h2hRow}>
      <div style={S.h2hName}>{other.name}</div>
      <div style={S.h2hBalances}>
        {/* gegen */}
        <div style={{ ...S.h2hCell, width: 108 }}>
          {vsTotal === 0 ? (
            <span style={S.h2hEmpty}>—</span>
          ) : (
            <>
              <span style={S.h2hWin}>{other.vsWins}</span>
              <span style={S.h2hSep}>:</span>
              <span style={S.h2hLoss}>{other.vsLosses}</span>
              {vsRate !== null && (
                <span style={S.h2hPct}>{vsRate}%</span>
              )}
            </>
          )}
        </div>
        {/* mit */}
        <div style={{ ...S.h2hCell, width: 88 }}>
          {withTotal === 0 ? (
            <span style={S.h2hEmpty}>—</span>
          ) : (
            <>
              <span style={S.h2hWin}>{other.withWins}</span>
              <span style={S.h2hSep}>:</span>
              <span style={S.h2hLoss}>{other.withLosses}</span>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

// ============================================================
// Statistiken pro Spieler (Phase 3)
// ============================================================
function StatsView({ data }) {
  const [selectedId, setSelectedId] = useState(null);

  const finishedGames = data.games.filter((g) => g.status === "finished");

  // Nur Spieler, die schon mind. 1 abgeschlossenes Spiel haben, sind interessant —
  // aber wir zeigen alle an, mit Hinweis bei 0 Spielen.
  const playersWithData = data.players.map((p) => ({
    player: p,
    stats: computePlayerStats(p.id, data.games),
  }));

  if (data.players.length === 0) {
    return (
      <section style={S.placeholder}>
        <div style={S.placeholderMark}>♥</div>
        <h2 style={S.h2}>Statistiken</h2>
        <p style={S.placeholderText}>
          Noch keine Spieler angelegt. Legt zuerst unter „Spieler" eure Gruppe
          an und spielt ein paar Runden.
        </p>
      </section>
    );
  }

  const selected = playersWithData.find((x) => x.player.id === selectedId);

  // Detailansicht eines Spielers
  if (selected) {
    return (
      <PlayerStatDetail
        player={selected.player}
        stats={selected.stats}
        onBack={() => setSelectedId(null)}
      />
    );
  }

  // Übersicht: Spielerliste mit Kurz-Kennzahl
  return (
    <section>
      <div style={S.sectionHead}>
        <h2 style={S.h2}>Statistiken</h2>
        <span style={{ ...S.pill, ...S.pillOk }}>
          {finishedGames.length} Spiel{finishedGames.length === 1 ? "" : "e"}
        </span>
      </div>

      {finishedGames.length === 0 && (
        <p style={S.hint}>
          Noch keine abgeschlossenen Spiele. Spielt ein Spiel zu Ende, dann
          erscheinen hier die Auswertungen.
        </p>
      )}

      <ul style={S.list}>
        {playersWithData.map(({ player, stats }) => (
          <li
            key={player.id}
            style={{ ...S.statRow, cursor: "pointer" }}
            onClick={() => setSelectedId(player.id)}
          >
            <span style={S.statRowName}>{player.name}</span>
            <span style={S.statRowMeta}>
              {stats.gamesPlayed === 0
                ? "keine Spiele"
                : `${stats.gameWins}S · ${stats.gamesPlayed} Sp · ${Math.round(
                    stats.gameWinRate * 100
                  )}%`}
            </span>
            <span style={S.statRowArrow}>›</span>
          </li>
        ))}
      </ul>
    </section>
  );
}

// ---------- Detailansicht eines Spielers ----------
function PlayerStatDetail({ player, stats, onBack }) {
  const pct = (v) => `${Math.round(v * 100)}%`;
  const num1 = (v) => (Math.round(v * 10) / 10).toFixed(1);

  const hasGames = stats.gamesPlayed > 0;

  const streakLabel = () => {
    if (stats.currentStreak === 0) return "—";
    const n = Math.abs(stats.currentStreak);
    return stats.currentStreak > 0 ? `${n} Siege in Folge` : `${n} Niederlagen in Folge`;
  };

  return (
    <section>
      <button style={S.backBtn} onClick={onBack}>
        ‹ Zurück
      </button>

      <div style={S.statHeader}>
        <div style={S.statAvatar}>{player.name.charAt(0).toUpperCase()}</div>
        <div>
          <div style={S.statName}>{player.name}</div>
          <div style={S.statSub}>
            {stats.gamesPlayed} Spiel{stats.gamesPlayed === 1 ? "" : "e"} ·{" "}
            {stats.roundsPlayed} Runde{stats.roundsPlayed === 1 ? "" : "n"}
          </div>
        </div>
      </div>

      {!hasGames && (
        <p style={S.hint}>
          {player.name} hat noch kein abgeschlossenes Spiel gespielt.
        </p>
      )}

      {hasGames && (
        <>
          {/* Spiel-Ebene */}
          <div style={S.statGroupLabel}>Spiele (Platzierung am Spielende)</div>
          <div style={S.statGrid}>
            <StatCard label="Spiel-Siege" value={stats.gameWins} sub={`Platz 1`} />
            <StatCard label="Niederlagen" value={stats.gameLosses} />
            <StatCard label="Win-Rate" value={pct(stats.gameWinRate)} accent />
            <StatCard
              label="Ø Platzierung"
              value={num1(stats.avgPlacement)}
            />
          </div>

          {/* Runden-Ebene */}
          <div style={S.statGroupLabel}>Runden</div>
          <div style={S.statGrid}>
            <StatCard label="Runden-Siege" value={stats.roundWins} />
            <StatCard label="Niederlagen" value={stats.roundLosses} />
            <StatCard label="Win-Rate" value={pct(stats.roundWinRate)} accent />
            <StatCard label="Runden ges." value={stats.roundsPlayed} />
          </div>

          {/* Punkte */}
          <div style={S.statGroupLabel}>Punkte</div>
          <div style={S.statGrid}>
            <StatCard label="Gesamtpunkte" value={stats.totalPoints} accent />
            <StatCard
              label="Ø pro Spiel"
              value={num1(stats.avgPointsPerGame)}
            />
            <StatCard
              label="Ø pro Runde"
              value={num1(stats.avgPointsPerRound)}
            />
            <StatCard
              label="Ø / 100 Runden"
              value={Math.round(stats.pointsPer100Rounds)}
              accent
            />
            <StatCard label="Beste Runde" value={stats.bestRound ?? "—"} />
            <StatCard label="Schlecht. Runde" value={stats.worstRound ?? "—"} />
          </div>

          {/* Solo & Streak */}
          <div style={S.statGroupLabel}>Solo &amp; Serie</div>
          <div style={S.statGrid}>
            <StatCard label="Solos gespielt" value={stats.soloPlayed} />
            <StatCard label="Solos gewonnen" value={stats.soloWon} />
            <StatCard
              label="Solo-Quote"
              value={stats.soloPlayed > 0 ? pct(stats.soloWinRate) : "—"}
              accent
            />
            <StatCard label="Aktuelle Serie" value={streakLabel()} small />
          </div>
        </>
      )}
    </section>
  );
}

function StatCard({ label, value, sub, accent, small }) {
  return (
    <div style={S.statCard}>
      <div style={S.statCardLabel}>{label}</div>
      <div
        style={{
          ...S.statCardValue,
          ...(accent ? S.statCardValueAccent : {}),
          ...(small ? S.statCardValueSmall : {}),
        }}
      >
        {value}
      </div>
      {sub && <div style={S.statCardSub}>{sub}</div>}
    </div>
  );
}

  <!-- Aufräumen: alte Service Worker abmelden und Caches leeren.
       (Behebt hartnäckig ausgelieferte alte Versionen.) -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      });
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) {
        keys.forEach(function (k) { caches.delete(k); });
      });
    }
  </script>
